name: Build and Release

on:
  push:
    tags:
      - "djehuti-station-v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CreationStation

    steps:
      # Station's own CMake (both the CreationSharedLLVM.cmake include and
      # the CREATION_SUITE_SHARED_DIR default) resolves everything shared/
      # as ../../shared relative to itself -- its real layout as an
      # apps/CreationStation submodule inside the Creation-Suite umbrella
      # repo. Rather than overriding each of those relative paths
      # individually (fragile -- a plain override missed the hardcoded
      # ../../shared/CMake/CreationSharedLLVM.cmake include entirely, the
      # first attempt at this workflow failed on exactly that), CI just
      # reproduces the real nesting: check out the umbrella first for its
      # shared/ tree, then check out this app's own tagged commit into
      # apps/CreationStation, overwriting the umbrella's empty submodule
      # placeholder. Every relative path then resolves exactly as it does
      # in a real Creation-Suite checkout.
      - name: Checkout Creation Suite umbrella (for shared/)
        uses: actions/checkout@v4
        with:
          repository: wwestlake/Creation-Suite
          ref: master
          # third_party/FrustLang is a submodule of the UMBRELLA repo, not
          # of CreationStation (confirmed: CreationStation has no
          # .gitmodules at all) -- without this it's an empty directory in
          # CI, and shared/FrustPluginRuntime's CMakeLists.txt EXISTS check
          # for it fails, falling through to its own FATAL_ERROR branch.
          # A previous fix mistakenly added submodules: true to the OTHER
          # checkout step below (CreationStation's own, which has no
          # submodules of its own -- harmless but useless there).
          submodules: true

      - name: Checkout this app at the release tag
        uses: actions/checkout@v4
        with:
          path: apps/CreationStation

      - name: Fetch JUCE
        shell: pwsh
        run: |
          git clone --depth 1 --branch 8.0.7 https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP\JUCE"

      - name: Fetch ASIO SDK
        shell: pwsh
        run: |
          # Pinned: the exact ASIO SDK release (2.3.4, dual licensed proprietary / GPLv3) every build uses.
          $asioCommit = "496a0765b8bb9c26f764f22f9a9712a937177db2"
          git init "$env:RUNNER_TEMP\ASIO"
          git -C "$env:RUNNER_TEMP\ASIO" fetch --depth 1 https://github.com/audiosdk/asio.git $asioCommit
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the pinned ASIO SDK." }
          git -C "$env:RUNNER_TEMP\ASIO" checkout FETCH_HEAD

          if (-not (Test-Path "$env:RUNNER_TEMP\ASIO\common\iasiodrv.h")) {
            throw "Could not find iasiodrv.h in fetched ASIO SDK."
          }

      - name: Restore prebuilt LLVM from S3 (no build, ever)
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          # Same real, already-built LLVM archive Creation Engine's own
          # release workflow restores (see that workflow's identically
          # named step for the full explanation) -- never invokes
          # vcpkg/cl.exe to compile anything. Extracts to
          # vcpkg_installed/x64-windows under this step's own working
          # directory (apps/CreationStation), which is exactly where
          # shared/CMake/CreationSharedLLVM.cmake's auto-discovery already
          # checks first for Station's own scripting host. FrustPluginRuntime
          # (via third_party/FrustLang) needs its own explicit
          # FRUST_VCPKG_INSTALLED_DIR override pointed at this same path --
          # see the Configure CMake step below.
          aws s3 cp s3://creation-suite-build-cache/vcpkg-cache/llvm-vcpkg-x64-windows.tar "$env:RUNNER_TEMP\llvm.tar"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the prebuilt LLVM archive from S3."
          }
          tar -xf "$env:RUNNER_TEMP\llvm.tar"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the prebuilt LLVM archive."
          }
          Remove-Item "$env:RUNNER_TEMP\llvm.tar" -Force
          if (-not (Test-Path "vcpkg_installed\x64-windows")) {
            throw "vcpkg_installed\x64-windows missing after extraction."
          }

      - name: Satisfy LLVM's baked-in DIA SDK path
        shell: pwsh
        run: |
          # See Creation Engine's own release workflow's identically named
          # step -- same S3 LLVM archive, same baked-in absolute path issue.
          $expected = "D:\Program Files\Microsoft Visual Studio\2022\Enterprise\DIA SDK\lib\amd64\diaguids.lib"
          if (Test-Path $expected) {
            Write-Host "Already present at expected path."
          } else {
            $found = Get-ChildItem -Path "C:\Program Files*\Microsoft Visual Studio" -Recurse -Filter "diaguids.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) {
              throw "Could not find diaguids.lib anywhere on this runner."
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $expected) | Out-Null
            Copy-Item -Path $found.FullName -Destination $expected -Force
            Write-Host "Copied $($found.FullName) -> $expected"
          }

      - name: Install WinFlexBison (prebuilt binary, no compile)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # third_party/FrustLang's grammar generation needs
          # win_bison.exe/win_flex.exe.
          #
          # This call must be authenticated -- api.github.com's
          # unauthenticated rate limit (60/hr) is shared across every
          # GitHub-hosted runner on whatever IP the runner lands on, and
          # gets exhausted easily; every job on this repo already has a
          # GITHUB_TOKEN available for free, which raises the limit to
          # 5000/hr scoped to this run.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
          # GitHub's API sometimes answers a temporary 404 or 5xx; that killed a whole release run once, so ask up to five times.
          $release = $null
          for ($attempt = 1; $attempt -le 5 -and -not $release; $attempt++) {
            try {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/lexxmark/winflexbison/releases/latest" -Headers $headers
            }
            catch {
              Write-Host "Attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          $asset = $release.assets | Where-Object { $_.name -like "*win_flex_bison*.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find a WinFlexBison release zip asset."
          }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\winflexbison.zip"
          New-Item -ItemType Directory -Force -Path "C:\tools\winflexbison" | Out-Null
          Expand-Archive -Path "$env:RUNNER_TEMP\winflexbison.zip" -DestinationPath "C:\tools\winflexbison" -Force
          if (-not (Test-Path "C:\tools\winflexbison\win_bison.exe")) {
            throw "win_bison.exe missing after WinFlexBison extraction."
          }

      - name: Classify release
        id: classify
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME

          switch -Regex -CaseSensitive ($tag) {
            '^djehuti-station-v(?<version>\d+\.\d+\.\d+)(?:-(?<channel>[0-9A-Za-z.-]+))?$' {
              $productSlug = "djehuti-station"
              $displayName = "Djehuti Station"
              $kind = "app"
              $cmakeTarget = "CreativeWorkstation"
              $componentName = "CreativeWorkstation"
              break
            }

            default {
              throw "Tag '$tag' must start with djehuti-station-v."
            }
          }

          $versionText = $Matches.version
          $explicitChannel = $Matches.channel
          $channel = "stable"
          $prerelease = "false"

          if ($explicitChannel) {
            if ($explicitChannel -match '^(alpha|beta)$') {
              $channel = $explicitChannel
            }
            else {
              $channel = $explicitChannel
            }

            $prerelease = "true"
          }
          else {
            $parts = $versionText.Split('.')
            $major = [int]$parts[0]
            $minor = [int]$parts[1]

            if ($major -eq 0 -and $minor -lt 5) {
              $channel = "alpha"
              $prerelease = "true"
            }
            elseif ($major -eq 0 -and $minor -ge 5) {
              $channel = "beta"
              $prerelease = "true"
            }
          }

          $suffix = ""
          if ($channel -ne "stable") {
            $suffix = " ($channel)"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "product_slug=$productSlug"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "display_name=$displayName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "kind=$kind"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "cmake_target=$cmakeTarget"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "component_name=$componentName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$versionText"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "channel=$channel"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "suffix=$suffix"

      - name: Configure CMake
        shell: pwsh
        run: |
          # Keep the runner release build within MSVC's heap budget without
          # overriding global compiler flags. The previous /GL- workaround
          # accidentally removed JUCE's required C++ exception setting.
          #
          # FRUST_VCPKG_INSTALLED_DIR: third_party/FrustLang's own top-level
          # CMakeLists.txt refuses to configure unless this is pointed at a
          # real vcpkg_installed/x64-windows tree containing LLVM (its
          # default assumes a dev machine's personal clone, which doesn't
          # exist on a runner) -- point it at the S3-restored one from the
          # "Restore prebuilt LLVM from S3" step above, same working
          # directory as this command.
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$env:RUNNER_TEMP\JUCE" -DCE_WINFLEXBISON_DIR="C:\tools\winflexbison" "-DFRUST_VCPKG_INSTALLED_DIR=$PWD\vcpkg_installed\x64-windows" "-DCREATION_STATION_VERSION=${{ steps.classify.outputs.version }}" "-DCREATION_STATION_ASIO_SDK_DIR=$env:RUNNER_TEMP\ASIO\common" -DCREATION_STATION_ENABLE_LTO=OFF

      - name: Build app
        shell: pwsh
        run: |
          cmake --build build --config Release --target ${{ steps.classify.outputs.cmake_target }} -- /m:1

      - name: Build the storage service
        shell: pwsh
        run: |
          # Station cannot run without the suite's storage service, so the release builds it and installs it with Station.
          # It is built with vcpkg's static-md triplet so it ships as ONE exe with no zlib or other library beside it.
          #
          # vcpkg runs in CLASSIC mode from a folder outside the repository, with the packages named on the command line.
          # Never in manifest mode from inside the repo: a manifest that lists llvm would start an LLVM build, and LLVM is
          # never built here (it is restored from S3 above).
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          Push-Location $env:RUNNER_TEMP
          & $vcpkg install "cpp-httplib:x64-windows-static-md" "ixwebsocket[core]:x64-windows-static-md" --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg could not install the storage service's packages." }
          Pop-Location

          $version = "${{ steps.classify.outputs.version }}"
          cmake -S ../../services/VfsService -B build-vfs -A x64 -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$env:RUNNER_TEMP\JUCE" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DVCPKG_MANIFEST_MODE=OFF "-DCREATION_SUITE_VFS_SERVICE_VERSION=$version"
          if ($LASTEXITCODE -ne 0) { throw "Could not configure the storage service." }
          cmake --build build-vfs --config Release --target CreationSuiteVfsService -- /m:1
          if ($LASTEXITCODE -ne 0) { throw "Could not build the storage service." }

          $service = Get-ChildItem build-vfs -Recurse -File -Filter DjehutiSuiteVfsService.exe | Select-Object -First 1
          if (-not $service) { throw "The storage service was not produced." }
          Write-Host "Storage service: $($service.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "VFS_SERVICE_EXE=$($service.FullName)"

      - name: Install MSI packaging tools
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $stageRoot = Join-Path $PWD "artifacts\stage"
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null

          $installRoot = Join-Path $stageRoot "${{ steps.classify.outputs.product_slug }}"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null

          cmake --install build --config Release --prefix $installRoot --component ${{ steps.classify.outputs.component_name }}

          $exe = Get-ChildItem $installRoot -Recurse -File | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          if (-not $exe) {
            throw "Could not find the packaged executable for ${{ steps.classify.outputs.display_name }}."
          }

          $betaGuide = "docs/Djehuti-Station-Beta-Tester-Guide.md"
          if (Test-Path $betaGuide) {
            Copy-Item -Path $betaGuide -Destination (Join-Path $installRoot "Beta-Tester-Guide.md") -Force
          }

          # Requirement: the application is self-contained and ships no library of ours.
          $shippedLibraries = Get-ChildItem $installRoot -Recurse -File -Filter *.dll
          if ($shippedLibraries) {
            $shippedLibraries | ForEach-Object { Write-Host "SHIPPED LIBRARY: $($_.FullName)" }
            throw "The package contains library files. The application must ship none."
          }

          # ASIO must be built in. If this build lost it, the ASIO device type would be missing from every user's audio settings, and
          # nothing else would say so. JUCE's ASIO code reads the registry key "software\asio", so that text (UTF-16) is in an exe
          # that has ASIO and not in one that does not.
          $exeBytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $exeText = [System.Text.Encoding]::Latin1.GetString($exeBytes)
          $asioMarker = "software\asio".ToCharArray() -join "`0"
          if (-not $exeText.Contains($asioMarker)) { throw "The executable was built WITHOUT ASIO. ASIO is required." }
          Write-Host "ASIO is built into the executable."

          # Its own imports may only be Windows system libraries and the Visual C++ runtime.
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "**\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "Could not find dumpbin to check the executable's imports." }
          $imports = & $dumpbin /dependents $exe.FullName | Where-Object { $_ -match '\.dll' } | ForEach-Object { $_.Trim().ToLower() }
          $allowed = '^(kernel32|user32|gdi32|advapi32|shell32|shlwapi|ole32|oleaut32|comdlg32|comctl32|imm32|version|winmm|ws2_32|wsock32|wininet|winhttp|dbghelp|dwmapi|opengl32|d3d11|dxgi|d2d1|dcomp|d3dcompiler_47|mfplat|mfreadwrite|mf|mfuuid|setupapi|rpcrt4|crypt32|bcrypt|secur32|iphlpapi|psapi|userenv|uxtheme|windowscodecs|msvcp140(_\w+)?|vcruntime140(_1)?|concrt140|ucrtbase|api-ms-win-crt-[\w-]+l\d-\d-\d)\.dll$'
          $foreign = $imports | Where-Object { $_ -notmatch $allowed }
          if ($foreign) {
            $foreign | ForEach-Object { Write-Host "NON-SYSTEM IMPORT: $_" }
            throw "The executable imports libraries that are not part of Windows or the Visual C++ runtime."
          }

          # The storage service ships beside Station (the zip is portable: Station finds the service in its own folder). It must
          # be as self-contained as the app, so a clean machine can run it: only Windows and the Visual C++ runtime.
          if (-not $env:VFS_SERVICE_EXE -or -not (Test-Path $env:VFS_SERVICE_EXE)) { throw "The storage service was not built." }
          $serviceImports = & $dumpbin /dependents $env:VFS_SERVICE_EXE | Where-Object { $_ -match '\.dll' } | ForEach-Object { $_.Trim().ToLower() }
          $serviceForeign = $serviceImports | Where-Object { $_ -notmatch $allowed }
          if ($serviceForeign) {
            $serviceForeign | ForEach-Object { Write-Host "NON-SYSTEM IMPORT (storage service): $_" }
            throw "The storage service imports libraries that are not part of Windows or the Visual C++ runtime."
          }
          Copy-Item -Path $env:VFS_SERVICE_EXE -Destination (Join-Path $installRoot "DjehutiSuiteVfsService.exe") -Force

          $zipName = Join-Path $PWD ("artifacts\{0}.zip" -f "${{ steps.classify.outputs.tag }}")
          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          Compress-Archive -Path (Join-Path $stageRoot "${{ steps.classify.outputs.product_slug }}\*") -DestinationPath $zipName -Force

      - name: Build MSI installer
        shell: pwsh
        run: |
          # The installer installs Station AND the storage service it cannot run without (see installer/DjehutiStation.wxs and
          # services/VfsService/installer/SuiteServices.wxs).
          $stage = Join-Path $PWD "artifacts\stage\${{ steps.classify.outputs.product_slug }}"
          $msi = Join-Path $PWD ("artifacts\{0}.msi" -f "${{ steps.classify.outputs.tag }}")
          & "$PWD\installer\build-msi.ps1" -StageDir $stage -VfsServiceExe $env:VFS_SERVICE_EXE `
            -ServicesWxs (Resolve-Path "..\..\services\VfsService\installer\SuiteServices.wxs").Path `
            -Version "${{ steps.classify.outputs.version }}" -OutFile $msi
          if (-not (Test-Path $msi)) { throw "The MSI was not produced." }

      - name: Verify the installer on a clean machine
        shell: pwsh
        run: |
          # Nothing is published unless this passes. A runner is a clean machine: it has never had Djehuti or its service, so
          # this is exactly the situation a customer is in - the one a developer's machine (which has the service) hides.
          $msi = Join-Path $PWD ("artifacts\{0}.msi" -f "${{ steps.classify.outputs.tag }}")
          $version = "${{ steps.classify.outputs.version }}"
          # Installed into a folder that is NOT the default (and on the runner's D: drive), to prove everything follows the
          # user's choice: <suite folder>\Djehuti Station and <suite folder>\Services, nothing anywhere else.
          $suiteDir = Join-Path $env:RUNNER_TEMP "Chosen Place\Djehuti Suite"
          $servicesDir = Join-Path $suiteDir "Services"
          $stationExe = Join-Path $suiteDir "Djehuti Station\DjehutiStation.exe"

          # 1. The package itself contains Station and the service. It is unpacked into a temporary folder (an administrative install:
          # nothing is installed or registered) and the files are looked for. Where the service is recorded is checked after the real
          # install below.
          $unpacked = Join-Path $env:RUNNER_TEMP "msi-unpacked"
          $p = Start-Process msiexec.exe -ArgumentList "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$unpacked`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The MSI could not be unpacked (exit code $($p.ExitCode)); it is not a valid installer." }
          if (-not (Get-ChildItem $unpacked -Recurse -File -Filter DjehutiSuiteVfsService.exe -ErrorAction SilentlyContinue)) { throw "The MSI does not contain the storage service." }
          if (-not (Get-ChildItem $unpacked -Recurse -File -Filter DjehutiStation.exe -ErrorAction SilentlyContinue)) { throw "The MSI does not contain Station." }
          Write-Host "The MSI contains Station and the storage service."

          # 2. It installs on this clean machine.
          $log = Join-Path $PWD "artifacts\install.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "SUITEFOLDER=`"$suiteDir\`"", "/l*v", "`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "The installer failed with exit code $($p.ExitCode)." }
          if (-not (Test-Path $stationExe)) { throw "Station was not installed at $stationExe." }
          $serviceExe = Join-Path $servicesDir "DjehutiSuiteVfsService.exe"
          if (-not (Test-Path $serviceExe)) { throw "The storage service was not installed at $serviceExe." }
          $recorded = (Get-ItemProperty "HKLM:\SOFTWARE\LagDaemon Software\Djehuti Suite" -Name ServicesDir -ErrorAction Stop).ServicesDir
          if ($recorded.TrimEnd('\') -ne $servicesDir.TrimEnd('\')) { throw "The registry says the service is at '$recorded', not '$servicesDir'." }
          $recordedSuite = (Get-ItemProperty "HKLM:\SOFTWARE\LagDaemon Software\Djehuti Suite" -Name SuiteDir -ErrorAction Stop).SuiteDir
          if ($recordedSuite.TrimEnd('\') -ne $suiteDir.TrimEnd('\')) { throw "The registry says the suite is at '$recordedSuite', not '$suiteDir'." }
          foreach ($stray in @((Join-Path $env:ProgramFiles "Djehuti Suite"), (Join-Path $env:ProgramFiles "DjehutiStation"))) {
            if (Test-Path $stray) { throw "Something was installed at '$stray', outside the folder that was chosen." }
          }

          # 3. The installed service really starts, and says which protocol it speaks and which version it is.
          $root = Join-Path $env:RUNNER_TEMP "vfs-root-check"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $config = Join-Path $env:APPDATA "Djehuti-Suite"
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          (@{ suiteVfsRoot = $root } | ConvertTo-Json) | Set-Content -Path (Join-Path $config "suite-settings.json") -Encoding UTF8
          $service = Start-Process $serviceExe -PassThru -WindowStyle Hidden
          try {
            $heartbeat = $null
            for ($i = 0; $i -lt 40 -and -not $heartbeat; $i++) {
              Start-Sleep -Milliseconds 500
              $heartbeat = Get-ChildItem $root -Recurse -File -Filter VfsHeartbeat.json -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if (-not $heartbeat) { throw "The installed storage service did not start (no heartbeat within 20 seconds)." }
            $record = Get-Content $heartbeat.FullName -Raw | ConvertFrom-Json
            Write-Host "Service heartbeat: $($heartbeat.FullName)"
            Write-Host ($record | ConvertTo-Json -Compress)
            if ([int]$record.serviceProtocol -lt 1) { throw "The service did not report its protocol version." }
            if ($record.serviceVersion -ne $version) { throw "The service reports version '$($record.serviceVersion)', expected '$version'." }
          }
          finally {
            Stop-Process -Id $service.Id -Force -ErrorAction SilentlyContinue
          }

          # 4. It uninstalls cleanly.
          $p = Start-Process msiexec.exe -ArgumentList "/x", "`"$msi`"", "/qn", "/l*v", "`"$(Join-Path $PWD 'artifacts\uninstall.log')`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The uninstaller failed with exit code $($p.ExitCode)." }
          if (Test-Path $stationExe) { throw "Station was left behind after uninstalling." }
          Remove-Item (Join-Path $PWD "artifacts\install.log"), (Join-Path $PWD "artifacts\uninstall.log") -Force -ErrorAction SilentlyContinue
          Write-Host "The installer installs Station and the storage service on a clean machine, the service starts, and it uninstalls cleanly."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.classify.outputs.product_slug }}
          path: apps/CreationStation/artifacts/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.classify.outputs.display_name }} ${{ steps.classify.outputs.version }}${{ steps.classify.outputs.suffix }}
          prerelease: ${{ steps.classify.outputs.prerelease }}
          files: apps/CreationStation/artifacts/*
